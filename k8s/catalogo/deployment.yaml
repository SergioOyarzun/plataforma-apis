apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
  namespace: apis
  labels:
    app: catalogo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      imagePullSecrets:              # NUEVO: credenciales para descargar de GHCR
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001    
      containers:
        - name: catalogo
          image: ghcr.io/sergiooyarzun/catalogo:8e57fbe
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: catalogo-db
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]